services:
  - type: web
    name: infog-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://infog-site.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: REDIS_URL
        sync: false